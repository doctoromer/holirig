[package]
name = "rig-test"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rig-test"
path = "src/main.rs"

[dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Variant",
] }
windows-core = "0.62.2"
clap = { version = "4", features = ["derive"] }
omnirig = { path = "../omnirig" }
