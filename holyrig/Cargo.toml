[package]
name = "holyrig"
version = "0.1.0"
edition = "2024"
default-run = "holyrig"

[lib]
name = "holyrig"
path = "src/lib.rs"

[[bin]]
name = "holyrig"
path = "src/main.rs"

[[bin]]
name = "parser"
path = "src/bin/parser.rs"

[dependencies]
anyhow = "1.0.97"
argh = "0.1.12"
holyrig-console = { path = "../holyrig-console" }
dirs = "6.0"
eframe = "0.32.0"
egui = "0.32.0"
egui_dock = "0.17.0"
logos = "0.15.1"
parking_lot = "0.12.4"
peg = "0.8.5"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.44.1", features = ["macros", "rt", "rt-multi-thread", "sync", "time", "io-util"] }
serialport = "4.7.0"
tokio-serial = "5.4.4"
toml = "0.8.20"
thiserror = "2.0.18"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
tray-icon = "0.21"
tracing-panic = "0.1.2"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
omnirig = { path = "../omnirig" }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
wayland-sys = { version = "0.31", features = ["client", "dlopen"] }

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
